name: Release wheels

on:
  push:
    tags: ["[0-9][0-9].[0-9]*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NIX_CONFIG: experimental-features = nix-command flakes
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  wheel:
    runs-on: ubuntu-latest
    # PyPI trusted publishing exchanges this token for an upload credential -- no secret is
    # stored in the repository. Configure the trusted publisher on pypi.org against this
    # workflow filename and the "pypi" environment below before the first tag push.
    environment:
      name: pypi
      url: https://pypi.org/project/lxdyn/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Before anything is built: a mismatch is fixed by retagging, which a published
      # release could not be.
      - name: Tag matches build.zig.zon
        if: github.ref_type == 'tag'
        run: sh tools/check-release-version.sh "$GITHUB_REF_NAME"
      - uses: cachix/install-nix-action@v31

      # One wheel per CPython, each installed and tested in a clean venv before any is published.
      - name: Build and check the wheels
        run: nix develop --command mise run python:wheels

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: build/dist
