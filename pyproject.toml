[project]
name = "xdyn-dev"
version = "0"
description = "Development environments for the xdyn repository — not a distributable package"

requires-python = ">=3.10"

dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["xdyn_wrapper_python"]

[dependency-groups]
test-cli = ["h5py", "numpy"]
test-grpc = [
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "pyyaml",
    "numpy",
    "pytest",
    "websocket-client==0.56.0",
]
wrapper = ["pybind11[global]>=3.0", "numpy", "pytest", "setuptools", "wheel"]
fmu = ["fmpy", "numpy", "pytest"]
lint = ["ruff"]
wheelcheck = ["numpy", "pytest"]
doc = ["sphinx", "sphinx-autopackagesummary", "myst-parser", "numpy"]

[tool.ruff]
include = ["xdyn_wrapper_python/**/*.py", "xdyn_wrapper_fmi/**/*.py"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["I", "W"]

[tool.ruff.lint.isort]
known-third-party = ["xdyn"]

[tool.pytest.ini_options]
testpaths = ["xdyn_wrapper_python/unit_tests"]
filterwarnings = [
    "ignore:cannot collect 'test_ship_hdb':pytest.PytestCollectionWarning",
]
