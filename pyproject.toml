[project]
name = "xdyn-dev"
version = "0"
description = "Development environments for the xdyn repository — not a distributable package"

requires-python = ">=3.11"

dependencies = []

[tool.uv]
package = false
# The same interpreters locally as in CI, never the host's.
python-preference = "only-managed"

[dependency-groups]
test-cli = ["h5py", "numpy"]
test-grpc = [
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "pyyaml",
    "numpy",
    "pytest",
    "websocket-client",
]
wrapper = ["numpy", "pytest"]
fmu = ["fmpy", "numpy", "pytest"]
lint = ["ruff"]
doc = ["sphinx", "sphinx-autopackagesummary", "myst-parser", "numpy"]

[tool.ruff]
include = ["xdyn_wrapper_python/**/*.py", "xdyn_wrapper_fmi/**/*.py"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["I", "W"]

[tool.ruff.lint.isort]
known-third-party = ["xdyn"]

[tool.pytest.ini_options]
testpaths = ["xdyn_wrapper_python/unit_tests"]
filterwarnings = [
    "ignore:cannot collect 'test_ship_hdb':pytest.PytestCollectionWarning",
]
