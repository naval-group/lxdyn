[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lxdyn"
description = "Python bindings for xdyn, a naval hydrodynamics simulator"
authors = [{ name = "Julien Prodhon", email = "julien@prodhon.net" }]
license = "EPL-2.0"
license-files = ["../LICENSE.md"]
readme = "README.md"

requires-python = ">=3.10"
dependencies = ["numpy"]
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=6.0"]

[project.urls]
Homepage = "https://github.com/naval-group/lxdyn"
Source = "https://github.com/naval-group/lxdyn"
