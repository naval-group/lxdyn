# The wheel's metadata. zig builds the module and make_wheel.py packs it: `nix build .#lxdyn-wheels`.
[project]
name = "lxdyn"
description = "Python bindings for xdyn, a naval hydrodynamics simulator"
authors = [{ name = "Julien Prodhon", email = "julien@prodhon.net" }]
license = "EPL-2.0"
license-files = ["LICENSE.md"]
readme = "README.md"

requires-python = ">=3.11"
dependencies = ["numpy"]
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/naval-group/lxdyn"
Source = "https://github.com/naval-group/lxdyn"
