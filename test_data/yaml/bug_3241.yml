rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1000, unit: kg/m^3}
    nu: {value: 1.14e-6, unit: m^2/s}

# Fixed frame: NED
bodies: # All bodies have NED as parent frame
  - name: dtmb
    position of body frame relative to mesh:
        frame: mesh
        x: {value: 1.509, unit: m}
        y: {value: 0, unit: m}
        z: {value: -0.160, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    dynamics:
        hydrodynamic forces calculation point in body frame:
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0.072, unit: m}
        centre of inertia:
            frame: dtmb
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m} 
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            row 1: [80.555,0,0,0,0,0]
            row 2: [0,80.555,0,0,0,0]
            row 3: [0,0,80.555,0,0,0]
            row 4: [0,0,0,1.845,0,0]
            row 5: [0,0,0,0,46.77,0]
            row 6: [0,0,0,0,0,46.77]
        added mass matrix at the center of gravity and projected in the body frame:
            # T min Aqua+ (0.51s)
            row 1: [ 8.663E-01, 0.000E+00, -1.911E+00,  0.000E+00, -4.063E+00,  0.000E+00]
            row 2: [ 0.000E+00, 2.096E+01,  0.000E+00,  2.351E-01,  0.000E+00,  5.225E+00]
            row 3: [-1.911E+00, 0.000E+00,  9.340E+01,  0.000E+00,  1.391E+01,  0.000E+00]
            row 4: [ 0.000E+00, 2.351E-01,  0.000E+00,  1.718E-01,  0.000E+00, -9.904E-01]
            row 5: [-4.063E+00, 0.000E+00,  1.391E+01,  0.000E+00,  4.053E+01,  0.000E+00]
            row 6: [ 0.000E+00, 5.225E+00,  0.000E+00, -9.904E-01,  0.000E+00,  1.484E+01]
    mesh: dtmb_IIHR.stl
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: -0.0357, unit: m}
        phi: {value: 0, unit: deg}
        theta: {value: 0.027, unit: deg}
        psi: {value: 0, unit: deg}
    initial velocity of body frame relative to NED:
        frame: dtmb
        u: {value: 1.531, unit: m/s}
        v: {value: 0, unit: m/s}
        w: {value: 0.000721, unit: m/s}
        p: {value: 0, unit: rad/s}
        q: {value: 0, unit: rad/s}
        r: {value: 0, unit: rad/s}
    blocked dof:
        from YAML:
            - state: u
              t: [0, 5, 10, 15]
              value: [1.531, 1, 1.5, 0]
              interpolation: piecewise constant
            - state: v
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: w
              t: [0, 10000]
              value: [0.000721, 0.000721]
              interpolation: piecewise constant
            - state: p
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: q
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: r
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
    external forces:
      - model: gravity
      - model: non-linear hydrostatic (exact)
      - model: non-linear Froude-Krylov
      - model: linear damping
        damping matrix at the center of gravity projected in the body frame:
            row 1: [ 0, 0,      0,      0,       0, 0]
            row 2: [ 0, 0,      0,      0,       0, 0]
            row 3: [ 0, 0, 5.83e2,      0,       0, 0]
            row 4: [ 0, 0,      0, 2.19e-1,       0, 0]
            row 5: [ 0, 0,      0,      0, 3.06e2, 0]
            row 6: [ 0, 0,      0,      0,       0, 0]
      - model: quadratic damping
        damping matrix at the center of gravity projected in the body frame:
            row 1: [ 0, 0, 0,      0, 0, 0]
            row 2: [ 0, 0, 0,      0, 0, 0]
            row 3: [ 0, 0, 0,      0, 0, 0]
            row 4: [ 0, 0, 0, 2.35e-1, 0, 0]
            row 5: [ 0, 0, 0,      0, 0, 0]
            row 6: [ 0, 0, 0,      0, 0, 0]
      - model: resistance curve
        speed: {unit: m/s, values: [-0.14, 0.00, 0.14, 0.27, 0.41, 0.55, 0.68, 0.82, 0.96, 1.09, 1.23, 1.37, 1.50, 1.64, 1.78, 1.91, 2.05, 2.19, 2.32, 2.46]}
        resistance: {unit: N, values: [-0.08, 0.00, 0.08, 0.30, 0.68, 1.21, 1.89, 2.72, 3.71, 4.84, 6.13, 7.57, 9.16, 10.90, 12.79, 14.83, 17.03, 19.37, 21.87, 24.52]}
environment models:
  - model: no waves
    constant sea elevation in NED frame: {value: 0, unit: m}
output:
  - format: map
    data: [u(dtmb)]