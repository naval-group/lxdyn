rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1025, unit: kg/m^3}
    nu: {value: 1.18e-6, unit: m^2/s}
    air rho: {value: 1.225, unit: kg/m^2}
environment models:
  - model: waves
    discretization:
       n: 1
       omega min: {value: 0.1, unit: rad/s}
       omega max: {value: 6.2, unit: rad/s}
       energy fraction: 0.999
    spectra:
      - model: airy
        depth: {value: 100000, unit: m}
        seed of the random data generator: 0
        stretching:
           delta: 0
           h: {unit: m, value: 100000}
        directional spreading:
           type: dirac
           waves propagating to: {value: 0.001, unit: deg}
        spectral density:
           type: dirac
           omega0: {value: 0.0982, unit: rad/s}
           Hs: {value: 2., unit: m}
# Fixed frame: NED
bodies: # All bodies have NED as parent frame
  - name: TestShip
    mesh: test_ship.stl
    position of body frame relative to mesh:
        frame: mesh
        x: {value: 9.355, unit: m}
        y: {value: 0, unit: m}
        z: {value: -3.21, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: -5, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: -0.0058, unit: rad}
        psi: {value: 0, unit: rad}
    initial velocity of body frame relative to NED:
        frame: TestShip
        u: {value: 0, unit: m/s}
        v: {value: 0, unit: m/s}
        w: {value: 0, unit: m/s}
        p: {value: 0, unit: rad/s}
        q: {value: 0, unit: rad/s}
        r: {value: 0, unit: rad/s}
    dynamics:
        hydrodynamic forces calculation point in body frame:
            x: {value: 0.696, unit: m}
            y: {value: 0, unit: m}
            z: {value: 1.418, unit: m}
        centre of inertia:
            frame: TestShip
            x: {value: 0.258, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0.432, unit: m}
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            row 1: [253310,0,0,0,0,0]
            row 2: [0,253310,0,0,0,0]
            row 3: [0,0,253310,0,0,0]
            row 4: [0,0,0,1.522e6,0,0]
            row 5: [0,0,0,0,8.279e6,0]
            row 6: [0,0,0,0,0,7.676e6]
        added mass matrix at the center of gravity and projected in the body frame:
            row 1: [3.519e4,0,0,0,0,0]
            row 2: [0,3.023e5,0,0,0,0]
            row 3: [0,0,1.980e5,0,0,0]
            row 4: [0,0,0,3.189e5,0,0]
            row 5: [0,0,0,0,8.866e6,0]
            row 6: [0,0,0,0,0,6.676e6]
    external forces:
      - model: diffraction
        hdb: v00_complet_FK_diffr.hdb
        calculation point in body frame:
            x: {value: 0.696, unit: m}
            y: {value: 0, unit: m}
            z: {value: 1.418, unit: m}
        mirror for 180 to 360: true
    blocked dof:
        from YAML:
            - state: u
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: v
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: w
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: p
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: q
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: r
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
output:
   - format: map
     data: ['Fx(diffraction,TestShip,TestShip)', 'Fy(diffraction,TestShip,TestShip)', 'Fz(diffraction,TestShip,TestShip)', 'Mx(diffraction,TestShip,TestShip)', 'My(diffraction,TestShip,TestShip)', 'Mz(diffraction,TestShip,TestShip)']
