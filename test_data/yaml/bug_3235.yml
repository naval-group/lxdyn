rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1000, unit: kg/m^3}
    nu: {value: 1.14e-6, unit: m^2/s}

# Fixed frame: NED
bodies: # All bodies have NED as parent frame
  - name: dtmb
    position of body frame relative to mesh:
        frame: mesh
        x: {value: 1.375, unit: m}
        y: {value: 0, unit: m}
        z: {value: -0.148, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    dynamics:
        hydrodynamic forces calculation point in body frame:
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0.068, unit: m}
        centre of inertia:
            frame: dtmb
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m} 
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            row 1: [63.5,0,0,0,0,0]
            row 2: [0,63.5,0,0,0,0]
            row 3: [0,0,63.5,0,0,0]
            row 4: [0,0,0,1.028,0,0]
            row 5: [0,0,0,0,30.76,0]
            row 6: [0,0,0,0,0,30.76]
        added mass matrix at the center of gravity and projected in the body frame:
            from hdb: dtmb_bego.HDB
    mesh: dtmb_bego.stl
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: -0.0270, unit: m}
        phi: {value: 0, unit: deg}
        theta: {value: 0.02, unit: deg}
        psi: {value: 0, unit: deg}
    initial velocity of body frame relative to NED:
        frame: dtmb
        u: {value: 0, unit: m/s}
        v: {value: 0, unit: m/s}
        w: {value: 0, unit: m/s}
        p: {value: 0, unit: rad/s}
        q: {value: 0, unit: rad/s}
        r: {value: 0, unit: rad/s}
    external forces:
      - model: gravity
      - model: non-linear hydrostatic (exact)
      - model: linear damping
        damping matrix at the center of gravity projected in the body frame:
            row 1: [ 0, 0,      0,      0,       0, 0]
            row 2: [ 0, 0,      0,      0,       0, 0]
            row 3: [ 0, 0, 4.68e2,      0,       0, 0]
            row 4: [ 0, 0,      0, 1.24e-1,       0, 0]
            row 5: [ 0, 0,      0,      0, 2.06e2, 0]
            row 6: [ 0, 0,      0,      0,       0, 0]
      - model: quadratic damping
        damping matrix at the center of gravity projected in the body frame:
            row 1: [ 0, 0, 0,      0, 0, 0]
            row 2: [ 0, 0, 0,      0, 0, 0]
            row 3: [ 0, 0, 0,      0, 0, 0]
            row 4: [ 0, 0, 0, 1.27e-1, 0, 0]
            row 5: [ 0, 0, 0,      0, 0, 0]
            row 6: [ 0, 0, 0,      0, 0, 0]
environment models:
  - model: no waves
    constant sea elevation in NED frame: {value: 0, unit: m}
