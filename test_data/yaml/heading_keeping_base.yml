            x: {value: 0.731, unit: m}
            y: {value: 0, unit: m}
            z: {value: 1.397, unit: m}
            phi: {value: 0, unit: deg}
            theta: {value: 0, unit: deg}
            psi: {value: 0, unit: deg}
        X: X_
        Y: Y_
        Z: 0.
        K: 0.
        M: 0.
        N: N_
        X_: (Xu0*u(t) + 1/2.*Xuu0*(u(t))^2 + 1/6.*Xuuu0*(u(t))^3) + (Xv*abs(v(t)) + 1/2.*Xvv*(v(t))^2) + Xuv*u(t)*v(t) + Xr*r(t)
        Y_: (Yv*v(t) + 1/2.*Yvv*v(t)*abs(v(t)) + 1/6.*Yvvv*(v(t))^3) + Yuv*u(t)*v(t) + Yr*r(t)
        N_: (Nv*v(t) + 1/2.*Nvv*v(t)*abs(v(t))) + Nuv*u(t)*v(t) + Nr*r(t)
        Xu0:    0.
        Xuu0:   0.
        Xuuu0:  0.
        Xv:    -5.528E+03
        Xvv:   -1.301E+05
        Xuv:   -9.539E+02
        Xr:    -1.462E+06
        Xrp:    1.246E+07
        Yv:     2.925E+05
        Yvv:   -4.548E+05
        Yvvv:  -2.292E+05
        Yuv:   -1.504E+05
        Yr:    -8.542E+07
        Yvp:   -1.056E+07
        Yrp:    1.958E+08
        Nv:     3.979E+07
        Nvv:   -2.511E+07
        Nuv:   -1.392E+07
        Nr:    -9.677E+09
        Nvp:   -8.913E+08
        Nrp:    2.609E+10
