        resistance: {unit: N, values: [-1.890E+04, 0.000E+00, 1.890E+04, 2.557E+04, 3.185E+04, 3.683E+04, 3.853E+04, 4.778E+04, 5.996E+04, 6.849E+04, 8.565E+04, 9.835E+04, 1.145E+05, 1.357E+05, 1.613E+05, 1.789E+05, 1.991E+05, 2.253E+05, 2.465E+05, 2.720E+05, 3.029E+05, 3.327E+05, 3.708E+05, 4.061E+05, 4.415E+05, 4.762E+05, 5.392E+05, 6.029E+05, 6.597E+05, 7.331E+05, 7.862E+05, 8.579E+05, 9.303E+05, 1.011E+06, 1.117E+06, 1.254E+06, 1.414E+06, 1.526E+06, 1.611E+06, 1.723E+06, 1.846E+06, 2.056E+06, 2.283E+06, 2.530E+06, 2.708E+06, 2.992E+06]}
      - name: PSPropRudd
        model: propeller+rudder
        position of propeller frame:
            frame: dtmb
            x: {value: -60.695, unit: m}
            y: {value: -4.650, unit: m}
            z: {value: 6.574, unit: m}
            phi: {value: 0, unit: rad}
            theta: {value: 2.95, unit: deg}
            psi: {value: 0, unit: deg}
        wake coefficient w: 0.15
        relative rotative efficiency etaR: 1
        thrust deduction factor t: 0.12
        rotation: clockwise
        number of blades: 5
        blade area ratio AE/A0: 0.58
        diameter: {value: 6.15, unit: m}
