rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1000, unit: kg/m^3}
    nu: {value: 1.18e-6, unit: m^2/s}
environment models:
  - model: no wind
  - model: no waves
    constant sea elevation in NED frame: {value: 12, unit: m}
    
# Fixed frame: NED
bodies: # All bodies have NED as parent frame
  - name: body 1
    mesh: test_ship.stl
    position of body frame relative to mesh:
        frame: mesh
        x: {value: 10, unit: m}
        y: {value: 0.21, unit: m}
        z: {value: 33000, unit: m}
        phi: {value: 1, unit: rad}
        theta: {value: 3, unit: rad}
        psi: {value: 2, unit: rad}
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 4, unit: m}
        y: {value: 8, unit: m}
        z: {value: 12, unit: m}
        phi: {value: 1.3, unit: rad}
        theta: {value: 1.4, unit: rad}
        psi: {value: 1.5, unit: rad}
    initial velocity of body frame relative to NED:
        frame: body 1
        u: {value: -8, unit: m/s}
        v: {value: -9, unit: m/s}
        w: {value: 14, unit: m/s}
        p: {value: 56, unit: rad/s}
        q: {value: 7, unit: rad/s}
        r: {value: 6, unit: rad/s}
    dynamics:
        hydrodynamic forces calculation point in body frame:
            x: {value: 0.696, unit: m}
            y: {value: 0, unit: m}
            z: {value: 1.418, unit: m}
        centre of inertia:
            frame: body 1
            x: {value: 4, unit: m}
            y: {value: 7, unit: m}
            z: {value: -10, unit: m}
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            row 1: [1, 0, 0, 0, 0, 0]
            row 2: [0, 2, 0, 0, 0, 0]
            row 3: [0, 0, 3, 0, 0, 0]
            row 4: [0, 0, 0, 4, 0, 0]
            row 5: [0, 0, 0, 0, 5, 0]
            row 6: [0, 0, 0, 0, 0, 6]
        added mass matrix at the center of gravity and projected in the body frame:
            row 1: [0, 0, 0, 0, 0, 0]
            row 2: [0, 0, 0, 0, 0, 0]
            row 3: [0, 0, 0, 0, 0, 0]
            row 4: [0, 0, 0, 0, 0, 0]
            row 5: [0, 0, 0, 0, 0, 0]
            row 6: [0, 0, 0, 0, 0, 0]
    external forces:
      - model: gravity
      - model: non-linear hydrostatic (fast)
      - model: quadratic damping
        damping matrix at the center of gravity projected in the body frame:
            row 1: [  2,   3,   5,   7,  11,  13]
            row 2: [ 17,  19,  23,  29,  31,  37]
            row 3: [ 41,  43,  47,  53,  59,  61]
            row 4: [ 67,  71,  73,  79,  83,  89]
            row 5: [ 97, 101, 103, 107, 109, 113]
            row 6: [127, 131, 137, 139, 149, 151]
    blocked dof:
       from YAML:
         - state: u
           t: [0,4.2]
           value: [4,5]
           interpolation: linear
output:
   - format: csv
     filename: tutorial_1.csv
     data: [x(body 1)]
   - format: hdf5
     filename: tutorial_1.h5
     data: ['y(body 1)','z(body 1)','Fz(gravity,body 1,body 1)','waves']
