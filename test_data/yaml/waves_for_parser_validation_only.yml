rotations convention: [psi, theta', phi'']
discretization:
   n: 128
   omega min: {value: 0.1, unit: rad/s}
   omega max: {value: 6, unit: deg/s}
   energy fraction: 0.123
   equal energy bins: true
spectra:
  - model: airy
    seed of the random data generator: 0
    stretching:
       delta: 0.5
       h: {unit: m, value: 100}
    depth: {value: 1.7, unit: km}
    directional spreading:
       type: dirac
       waves propagating to: {value: 90, unit: deg}
    spectral density:
       type: jonswap
       Hs: {value: 5, unit: m}
       Tp: {value: 15, unit: s}
       gamma: 1.2
  - model: airy
    depth: {value: 12, unit: m}
    seed of the random data generator: 1872
    stretching:
         delta: 0.6
         h: {unit: m, value: 101}
    directional spreading:
       type: cos2s
       s: 2
       waves propagating to: {value: 90, unit: deg}
    spectral density:
       type: dirac
       Hs: {value: 5, unit: m}
       Tp: {value: 15, unit: s}
output:
    frame of reference: NED
    mesh:
       xmin: {value: -10, unit: m}
       xmax: {value: 1, unit: km}
       nx: 10
       ymin: {value: -20, unit: m}
       ymax: {value: 3, unit: km}
       ny: 20
