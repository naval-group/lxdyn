rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1025, unit: kg/m^3}
    nu: {value: 1.19e-6, unit: m^2/s}
environment models:
  - model: no waves
    constant sea elevation in NED frame: {value: 0, unit: m}

# Fixed frame: NED
bodies: # All bodies have NED as parent frame
  - name: ship
    position of body frame relative to mesh:
        frame: mesh
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: 0, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: 0, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    initial velocity of body frame relative to NED:
        frame: ship
        u: {value: 0, unit: m/s}
        v: {value: 0, unit: m/s}
        w: {value: 0, unit: m/s}
        p: {value: 0, unit: rad/s}
        q: {value: 0, unit: rad/s}
        r: {value: 0, unit: rad/s}
    dynamics:
        hydrodynamic forces calculation point in body frame:
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 4.15, unit: m}
        centre of inertia:
            frame: ship
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m}
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            row 1: [6.09e6,0,0,0,0,0]
            row 2: [0,6.09e6,0,0,0,0]
            row 3: [0,0,6.09e6,0,0,0]
            row 4: [0,0,0,3.09e8,0,0]
            row 5: [0,0,0,0,6.44e9,0]
            row 6: [0,0,0,0,0,6.44e9]
        added mass matrix at the center of gravity and projected in the body frame:
            # T min Aqua+ (3.5s)
            row 1: [5.815E+04, 0.000E+00, 2.027E+05, 0.000E+00, 1.465E+07, 0.000E+00]
            row 2: [0.000E+00, 1.519E+06, 0.000E+00, 1.824E+05, 0.000E+00, 1.783E+07]
            row 3: [2.027E+05, 0.000E+00, 7.822E+06, 0.000E+00, 7.591E+07, 0.000E+00]
            row 4: [0.000E+00, 1.824E+05, 0.000E+00, 3.134E+07, 0.000E+00, 1.408E+08]
            row 5: [1.465E+07, 0.000E+00, 7.591E+07, 0.000E+00, 6.399E+09, 0.000E+00]
            row 6: [0.000E+00, 1.783E+07, 0.000E+00, 1.408E+08, 0.000E+00, 2.047E+09]
    external forces:
      - name: propeller
        model: wageningen B-series
        position of propeller frame:
            frame: ship
            x: {value: -53.319, unit: m}
            y: {value: -3.750, unit: m}
            z: {value: 6.799, unit: m}
            phi: {value: 0, unit: rad}
            theta: {value: 4., unit: deg}
            psi: {value: 0, unit: deg}
        wake coefficient w: 0.037
        relative rotative efficiency etaR: 1.
        thrust deduction factor t: 0.144
        rotation: clockwise
        number of blades: 4
        blade area ratio AE/A0: 0.77
        diameter: {value: 4.65, unit: m}
        rudder area: {value: 10.766, unit: m^2}
        rudder height: {value: 4.164, unit: m}
        effective aspect ratio factor: 1.7
output:
   - format: map
     data: ['Fx(propeller,ship,ship)',  'Fy(propeller,ship,ship)',  'Fz(propeller,ship,ship)',  'Mx(propeller,ship,ship)',  'My(propeller,ship,ship)',  'Mz(propeller,ship,ship)']
