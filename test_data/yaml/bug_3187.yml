rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1025, unit: kg/m^3}
    nu: {value: 1.19e-6, unit: m^2/s}
environment models:
  - model: no waves
    constant sea elevation in NED frame: {value: 0, unit: m}

# Fixed frame: NED
bodies: # All bodies have NED as parent frame
  - name: ship
    position of body frame relative to mesh:
        frame: mesh
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: 0, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: 0, unit: m}
        phi: {value: 0, unit: deg}
        theta: {value: 0, unit: deg}
        psi: {value: 0, unit: deg}
    initial velocity of body frame relative to NED:
        frame: ship
        u: {value: 1, unit: m/s}
        v: {value: 0, unit: m/s}
        w: {value: 0, unit: m/s}
        p: {value: 0, unit: rad/s}
        q: {value: 0, unit: rad/s}
        r: {value: 0, unit: rad/s}
    dynamics:
        hydrodynamic forces calculation point in body frame:
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m}
        centre of inertia:
            frame: ship
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m} 
        mass: {value: 1, unit: tonne} # Caution: 'ton' is the british ton which is 907.185 kg
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            frame: ship
            row 1: [1,0,0,0,0,0]
            row 2: [0,1,0,0,0,0]
            row 3: [0,0,1,0,0,0]
            row 4: [0,0,0,1,0,0]
            row 5: [0,0,0,0,1,0]
            row 6: [0,0,0,0,0,1]
        added mass matrix at the center of gravity and projected in the body frame:
            frame: ship
            row 1: [1,0,0,0,0,0]
            row 2: [0,1,0,0,0,0]
            row 3: [0,0,1,0,0,0]
            row 4: [0,0,0,1,0,0]
            row 5: [0,0,0,0,1,0]
            row 6: [0,0,0,0,0,1]
    blocked dof:
        from YAML:
          - state: u
            t: [2, 5]
            value: [666, 669]
            interpolation: linear
    external forces: []
