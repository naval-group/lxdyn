rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1025, unit: kg/m^3}
    nu: {value: 1.19e-6, unit: m^2/s}

# Fixed frame: NED
bodies: # All bodies have NED as parent frame
  - name: ship
    position of body frame relative to mesh:
        frame: mesh
        x: {value: 61.005, unit: m}
        y: {value: 0, unit: m}
        z: {value: -7.32, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    dynamics:
        hydrodynamic forces calculation point in body frame:
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 3.92, unit: m}
        centre of inertia:
            frame: ship
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m} 
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            row 1: [6.05e6,0,0,0,0,0]
            row 2: [0,6.05e6,0,0,0,0]
            row 3: [0,0,6.05e6,0,0,0]
            row 4: [0,0,0,3.07e8,0,0]
            row 5: [0,0,0,0,6.40e9,0]
            row 6: [0,0,0,0,0,6.40e9]
        added mass matrix at the center of gravity and projected in the body frame:
            frame: ship
            # T min Aqua+ (3.5s)
            row 1: [ 5.814E+04, 0.000E+00, -2.021E+05,  0.000E+00, -1.467E+07,  0.000E+00]
            row 2: [ 0.000E+00, 1.533E+06,  0.000E+00,  1.056E+05,  0.000E+00,  1.871E+07]
            row 3: [-2.021E+05, 0.000E+00,  7.830E+06,  0.000E+00,  7.468E+07,  0.000E+00]
            row 4: [ 0.000E+00, 1.056E+05,  0.000E+00,  3.170E+07,  0.000E+00, -1.402E+08]
            row 5: [-1.467E+07, 0.000E+00,  7.468E+07,  0.000E+00,  6.398E+09,  0.000E+00]
            row 6: [ 0.000E+00, 1.871E+07,  0.000E+00, -1.402E+08,  0.000E+00,  2.105E+09]
    mesh: ship_2008.stl
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: -2.18, unit: m}
        phi: {value: 0, unit: deg}
        theta: {value: 0.013, unit: deg}
        psi: {value: 0, unit: deg}
    initial velocity of body frame relative to NED:
        frame: ship
        u: {value: 5, unit: m/s}
        v: {value: 0, unit: m/s}
        w: {value: 1.13e-3, unit: m/s}
        p: {value: 0, unit: rad/s}
        q: {value: 0, unit: rad/s}
        r: {value: 0, unit: rad/s}
    blocked dof:
        from YAML:
            - state: u
              t: [0, 10000]
              value: [5, 5]
              interpolation: piecewise constant
            - state: v
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: w
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: p
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: q
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
            - state: r
              t: [0, 10000]
              value: [0, 0]
              interpolation: piecewise constant
    external forces:
      - model: diffraction
        hdb: ship_2008.HDB
        calculation point in body frame:
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m}
        mirror for 180 to 360: true
environment models:
  # - model: no waves
    # constant sea elevation in NED frame: {value: 0, unit: m}
  - model: waves
    discretization:
       n: 1
       omega min: {value: 0.1, unit: rad/s}
       omega max: {value: 6, unit: rad/s}
       energy fraction: 0.999
    spectra:
      - model: airy
        depth: {value: 100000, unit: m}
        seed of the random data generator: 0
        stretching:
           delta: 0
           h: {unit: m, value: 100000}
        directional spreading:
           type: dirac
           waves propagating to: {value: 180, unit: deg}
        spectral density:
           type: dirac
           omega0: {value: 0.62831853, unit: rad/s}
           Hs: {value: 2., unit: m}
    output:
        frame of reference: NED(ship)
        mesh:
            xmin: {value: 0, unit: m}
            xmax: {value: 0, unit: m}
            nx: 1
            ymin: {value: 0, unit: m}
            ymax: {value: 0, unit: m}
            ny: 1
output:
  - format: map
    data: ['Fx(diffraction,ship,ship)', 'Fy(diffraction,ship,ship)', 'Fz(diffraction,ship,ship)', 'Mx(diffraction,ship,ship)', 'My(diffraction,ship,ship)', 'Mz(diffraction,ship,ship)']
