rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1026, unit: kg/m^3}
    nu: {value: 1.18e-6, unit: m^2/s}
environment models:
  - model: waves
    spectra from a list of rays:
      - model: airy
        stretching:
           delta: 0.5
           h: {unit: m, value: 100}
        depth: {value: 1.7, unit: km}
        rays:
          # Two rays with T=8s and T=10s
          a: {values: [0.1, 0.5], unit: m}
          psi: {values: [180.0, 180.0], unit: deg}
          omega: {values: [0.628318, 0.785398], unit: rad/s}
          k: {values: [3.872832, 6.051301], unit: 1/m}
          phase: {values: [50, 90], unit: deg}
      - model: airy
        rays:
          # Two rays with T=10s and T=12s
          a: {values: [0.1, 0.5], unit: m}
          psi: {values: [180.0, 180.0], unit: deg}
          omega: {values: [0.523598, 0.628318], unit: rad/s}
          k: {values: [2.689467, 3.872832], unit: 1/m}
          phase: {values: [110, 130], unit: deg}
        depth: {value: 1000, unit: m}
        stretching:
           delta: 0.6
           h: {unit: m, value: 101}
    output:
        frame of reference: NED
        mesh:
           xmin: {value: -10, unit: m}
           xmax: {value: 1, unit: km}
           nx: 10
           ymin: {value: -20, unit: m}
           ymax: {value: 3, unit: km}
           ny: 20
