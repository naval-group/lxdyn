rotations convention: [psi, theta', phi'']

environmental constants:
    g: {value: 9.81, unit: m/s^2}
    rho: {value: 1000, unit: kg/m^3}
    nu: {value: 1.18e-6, unit: m^2/s}
environment models: []

bodies: # All bodies have NED as parent frame
  - name: ball
    position of body frame relative to mesh:
        frame: mesh
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: 0, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    initial position of body frame relative to NED:
        frame: NED
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: 0, unit: m}
        phi: {value: 0, unit: rad}
        theta: {value: 0, unit: rad}
        psi: {value: 0, unit: rad}
    initial velocity of body frame relative to NED:
        frame: ball
        u: {value: 0, unit: m/s}
        v: {value: 0, unit: m/s}
        w: {value: 0, unit: m/s}
        p: {value: 0, unit: rad/s}
        q: {value: 0, unit: rad/s}
        r: {value: 0, unit: rad/s}
    dynamics:
        hydrodynamic forces calculation point in body frame:
            x: {value: 0.696, unit: m}
            y: {value: 0, unit: m}
            z: {value: 1.418, unit: m}
        centre of inertia:
            frame: ball
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m}
        rigid body inertia matrix at the center of gravity and projected in the body frame:
            row 1: [1,0,0,0,0,0]
            row 2: [0,1,0,0,0,0]
            row 3: [0,0,1,0,0,0]
            row 4: [0,0,0,1,0,0]
            row 5: [0,0,0,0,1,0]
            row 6: [0,0,0,0,0,1]
        added mass matrix at the center of gravity and projected in the body frame:
            row 1: [0,0,0,0,0,0]
            row 2: [0,0,0,0,0,0]
            row 3: [0,0,0,0,0,0]
            row 4: [0,0,0,0,0,0]
            row 5: [0,0,0,0,0,0]
            row 6: [0,0,0,0,0,0]
    external forces:
      - model: maneuvering
        name: F1
        reference frame:
            frame: ball
            x: {value: 0, unit: m}
            y: {value: 0, unit: m}
            z: {value: 0, unit: m}
            phi: {value: 0, unit: deg}
            theta: {value: 0, unit: deg}
            psi: {value: 0, unit: deg}
        commands: [command1, b, a]
        X: x(t)
        Y: y(t-10)
        Z: command1*z(t)
        K: b*u(t-6)
        M: v(t-6) + command1*w(t-5) + 2*b*p(t-4) + q(t-3)/a
        N: 0