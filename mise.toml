[tasks.setup]
description = "Submodules and the SSC umbrella headers"
run = """
git submodule update --init
git -C external/ssc config submodule.ssc/f2c.url https://gitlab.com/sirehna_naval_group/ThirdParty/f2c.git
git -C external/ssc submodule update --init ssc/f2c
cd external/ssc/ssc && sh generate_module_header.sh
"""

[tasks.bootstrap]
description = "First-time setup for a fresh clone: submodules, SSC headers and a closure"
run = '''
mise run setup
if [ -e libcxx-x86_64-linux-gnu ]; then
    echo "bootstrap: libcxx-x86_64-linux-gnu is already here -- leaving it alone"
else
    mise run deps:fetch x86_64-linux-gnu
fi
'''

[tasks."deps:x86_64-linux-gnu"]
description = "Build the x86_64-linux-gnu closure (glibc 2.28 floor) into libcxx-x86_64-linux-gnu/ (hours)"
run = "tools/deps/build-all.sh x86_64-linux-gnu"

[tasks."deps:x86_64-linux-musl"]
description = "Build the x86_64-linux-musl closure — statically linked, no published asset yet"
run = "tools/deps/build-all.sh x86_64-linux-musl"

[tasks."deps:aarch64-linux-musl"]
description = "Build the aarch64-linux-musl closure (needs deps:x86_64-linux-gnu)"
run = "tools/deps/build-all.sh aarch64-linux-musl"

[tasks."deps:x86_64-windows-gnu"]
description = "Build the x86_64-windows-gnu closure (needs deps:x86_64-linux-gnu)"
run = "tools/deps/build-all.sh x86_64-windows-gnu"

[tasks."deps:fetch"]
description = "Download a prebuilt closure: mise run deps:fetch x86_64-linux-gnu"
run = "sh tools/deps/fetch.sh"

[tasks."deps:pack"]
description = "Pack a built closure into a release asset: mise run deps:pack x86_64-linux-gnu"
run = "sh tools/deps/pack.sh"

# -fqemu/-fwine rather than the host's binfmt_misc: where a foreign binary is registered,
# zig runs it transparently and these lanes pass without either emulator being declared.
[tasks."cross:aarch64-linux-musl"]
description = "Run the unit suite for aarch64-linux-musl under qemu"
run = "zig build test -Dtarget=aarch64-linux-musl -fqemu"

[tasks."cross:x86_64-windows-gnu"]
description = "Run the unit suite for x86_64-windows-gnu under wine"
run = "zig build test -Dtarget=x86_64-windows-gnu -fwine"

[tasks.cross]
description = "Run both cross suites (needs `nix develop .#cross`)"
run = """
mise run cross:aarch64-linux-musl
mise run cross:x86_64-windows-gnu
"""

[tasks.gdb]
description = "gdb a debug-built exe: mise run gdb -- run_all_tests --gtest_filter=Foo*"
run = "sh tools/gdb.sh"

[tasks."zig:build"]
description = "Build xdyn and the test runner -> build/<target>/bin"
run = """
sh tools/check-checkout.sh external/ssc/ssc/check_ssc_version.hpp
zig build
"""

[tasks.build]
description = "Build xdyn and run the 916 native unit tests"
# Native only: the cross suites need `nix develop .#cross` for qemu and wine, so running them
# here would fail for anyone in the default shell. Use `mise run cross` inside that shell.
depends = ["zig:build"]
run = "zig build test"

[tasks.demos]
description = "Generate the tutorial inputs, meshes and HDB files into demos/ (overwrites)"
# Both generators, not just the YAML one: the tutorials from 02 onwards name test_ship.stl
# and test_ship.hdb, which only generate_stl_examples writes.
depends = ["zig:build"]
run = """
BIN=$(sh tools/build-dir.sh)/bin
mkdir -p demos
"$BIN/generate_yaml_example" demos
"$BIN/generate_stl_examples" demos
"""

[tasks.xdyn]
description = "Run xdyn from the build tree: mise run xdyn -- tutorial_01_falling_ball.yml --dt 0.1 --tend 10"
# dir = cwd so relative input and output paths resolve where the user stands, not at the repo
# root -- the point being to spare them the $(sh tools/build-dir.sh)/bin prefix, which is
# still what resolves the per-host triple, just from an absolute path now.
depends = ["zig:build"]
dir = "{{cwd}}"
run = 'exec "$(sh "$MISE_PROJECT_ROOT/tools/build-dir.sh")/bin/xdyn"'

[tasks.integration]
description = "Run the 10 CLI integration tests against the zig build (no docker)"
depends = ["zig:build"]
run = """
UV_PROJECT_ENVIRONMENT=build/venv/cli uv sync --only-group test-cli --quiet
make -C integration_tests/xdyn PYTHON="$PWD/build/venv/cli/bin/python" all
"""

[tasks."integration:setup"]
description = "Python env + protobuf stubs for the gRPC/JSON tests"
run = '''
sh tools/check-checkout.sh external/interfaces/proto
UV_PROJECT_ENVIRONMENT=build/venv/grpc uv sync --only-group test-grpc --python 3.10 --quiet
mkdir -p external/interfaces/xdyngrpc/_proto
touch external/interfaces/xdyngrpc/_proto/__init__.py
build/venv/grpc/bin/python -m grpc_tools.protoc \
    -I external/interfaces/proto \
    --python_out=external/interfaces/xdyngrpc/_proto \
    --grpc_python_out=external/interfaces/xdyngrpc/_proto \
    external/interfaces/proto/*.proto
for f in external/interfaces/xdyngrpc/_proto/*.py; do
    sed -E 's/^import.*_pb2/from . &/' "$f" > "$f.rel" && mv "$f.rel" "$f"
done
'''

[tasks."integration:grpc"]
description = "Run the 8 gRPC + 1 JSON protocol integration tests (no docker)"
depends = ["zig:build", "integration:setup"]
run = """
make -C integration_tests/grpc_tests
make -C integration_tests/json_tests
"""

[tasks."deploy:stage"]
description = "Build the static musl binaries and stage them stripped into build/scratch/deploy/"
run = '''
set -e
for t in llvm-strip llvm-readelf; do
    command -v $t > /dev/null 2>&1 || { echo "deploy:stage needs $t (pkgs.llvm)" >&2; exit 1; }
done
zig build -Dtarget=x86_64-linux-musl --prefix build/scratch/deploy-build
rm -rf build/scratch/deploy
mkdir -p build/scratch/deploy
for b in xdyn xdyn-for-cs xdyn-for-me gz generate_yaml_example generate_stl_examples; do
    cp "build/scratch/deploy-build/bin/$b" build/scratch/deploy/
    llvm-strip --strip-debug "build/scratch/deploy/$b"
    if llvm-readelf -l -d "build/scratch/deploy/$b" | grep -qE 'INTERP|NEEDED'; then
        echo "refusing to stage: $b is dynamically linked, and FROM scratch has no loader" >&2
        llvm-readelf -l -d "build/scratch/deploy/$b" | grep -E 'INTERP|NEEDED' >&2
        exit 1
    fi
done
echo "six static binaries: no interpreter, no NEEDED entries"
du -sh build/scratch/deploy
'''

[tasks."deploy:image"]
description = "Build the lxdyn deploy image from the Containerfile"
depends = ["deploy:stage"]
run = '''
CONTAINER=${CONTAINER:-$(command -v podman > /dev/null 2>&1 && echo podman || echo docker)}
# Same version idiom as python:build, so the wheel and the image agree on what a release is.
"$CONTAINER" build -f Containerfile \
    --build-arg VERSION="$(git describe --abbrev=0 --tag --always | cut -f2 -dv)" \
    --build-arg REVISION="$(git rev-parse HEAD)" \
    -t localhost/lxdyn .
# `images`, not `image inspect --format`: mise renders task scripts through Tera, so a Go
# template is parsed as a mise expression and the task never reaches the shell.
"$CONTAINER" images localhost/lxdyn
'''

[tasks."deploy:publish"]
description = "Push the deploy image to ghcr.io/naval-group/lxdyn under the current tag"
depends = ["deploy:image"]
run = '''
set -e
CONTAINER=${CONTAINER:-$(command -v podman > /dev/null 2>&1 && echo podman || echo docker)}
REGISTRY=${REGISTRY:-ghcr.io/naval-group/lxdyn}

# --exact-match, not the --abbrev=0 idiom used above: that one reports 26.8 for every commit
# after 26.8, so it would republish the release from an arbitrary tree.
VERSION=${VERSION:-}
if [ -z "$VERSION" ]; then
    VERSION=$(git describe --exact-match --tags 2>/dev/null | cut -f2 -dv) || {
        echo "refusing to publish: HEAD is not tagged, so there is no version to publish it as" >&2
        echo "  git tag -s 26.9 -m 26.9 && git push fork 26.9   (or pass VERSION=)" >&2
        exit 1
    }
fi
git diff --quiet HEAD || { echo "refusing to publish: the working tree is dirty" >&2; exit 1; }

"$CONTAINER" tag localhost/lxdyn "$REGISTRY:$VERSION"
"$CONTAINER" tag localhost/lxdyn "$REGISTRY:latest"
"$CONTAINER" push "$REGISTRY:$VERSION"
"$CONTAINER" push "$REGISTRY:latest"
echo "pushed $REGISTRY:$VERSION and $REGISTRY:latest"
'''

[tasks."deploy:server-image"]
description = "Build the xdyngrpc-python server image used by the deployment smoke test"
run = '''
CONTAINER=${CONTAINER:-$(command -v podman > /dev/null 2>&1 && echo podman || echo docker)}
sh tools/check-checkout.sh external/interfaces/Dockerfile.python
"$CONTAINER" build -f external/interfaces/Dockerfile.python -t localhost/xdyngrpc-python external/interfaces
'''

[tasks."deploy:test"]
description = "Deployment smoke test: the image starts, simulates, and serves gRPC"
depends = ["zig:build", "deploy:image", "deploy:server-image", "integration:setup"]
run = "sh integration_tests/deploy/run.sh"

[tasks."python:setup"]
description = "Python env for the pybind11 wrapper (pinned pybind11 + numpy)"
run = 'UV_PROJECT_ENVIRONMENT=build/venv/wrapper-3.10 uv sync --only-group wrapper --quiet'

[tasks."python:build"]
description = "Build the pybind11 extension module -> build/<triple>/python/"
depends = ["python:setup"]
run = '''
PY=$PWD/build/venv/wrapper-3.10/bin/python
zig build python -Dpython="$PY" \
    -Dgit-version="$(git describe --abbrev=0 --tag --always | cut -f2 -dv)"
SO_DIR=$(sh tools/build-dir.sh)/python
SO=$SO_DIR/xdyn$("$PY" -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')
[ -f "$SO" ] || { echo "expected $SO, got:"; ls "$SO_DIR"; exit 1; }
PYTHONPATH="$SO_DIR" "$PY" -c "import xdyn; print('import ok, xdyn', xdyn.__version__)"
echo "OK -> $SO"
'''

[tasks."python:test"]
description = "Run the 285 Python binding tests against the built module"
depends = ["python:build"]
run = '''
SO_DIR=$(sh tools/build-dir.sh)/python
TESTS=$PWD/xdyn_wrapper_python/unit_tests
PY=$PWD/build/venv/wrapper-3.10/bin/python
mkdir -p build/scratch/python-tests
cd build/scratch/python-tests
PYTHONPATH="$SO_DIR" "$PY" -m pytest "$TESTS"
'''

[tasks."python:matrix"]
description = "Build and test the wrapper against each supported Python (3.10, 3.13, 3.15)"
run = '''
set -e
TESTS=$PWD/xdyn_wrapper_python/unit_tests
for V in ${XDYN_PYTHON_VERSIONS:-3.10 3.13 3.15}; do
    echo "--- Python $V"
    UV_PROJECT_ENVIRONMENT=build/venv/wrapper-$V uv sync --only-group wrapper --python "$V" --quiet
    PY=$PWD/build/venv/wrapper-$V/bin/python
    zig build python -Dpython="$PY" \
        -Dgit-version="$(git describe --abbrev=0 --tag --always | cut -f2 -dv)"
    SO_DIR=$(sh tools/build-dir.sh)/python
    mkdir -p build/scratch/python-tests
    (cd build/scratch/python-tests && PYTHONPATH="$SO_DIR" "$PY" -m pytest -q "$TESTS")
done
'''

[tasks."python:wheel"]
description = "Package the module as a wheel and check it in a clean venv"
depends = ["python:build"]
run = '''
set -e
SO_DIR=$(sh tools/build-dir.sh)/python
PY=$PWD/build/venv/wrapper-3.10/bin/python
cd xdyn_wrapper_python
DEST=$("$PY" -c "
from setuptools import Extension
from setuptools.dist import Distribution
from setuptools.command.build_ext import build_ext
cmd = build_ext(Distribution({'name': 'xdyn', 'ext_modules': [Extension('xdyn', sources=[])]}))
cmd.initialize_options(); cmd.finalize_options()
print(cmd.get_ext_fullpath('xdyn'))
")
mkdir -p "$(dirname "$DEST")"
SO=$SO_DIR/xdyn$("$PY" -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')
cp "$SO" "$DEST"
for s in llvm-strip strip; do
    if command -v "$s" > /dev/null 2>&1; then "$s" --strip-debug "$DEST" && break; fi
    [ "$s" = strip ] && echo "warning: no llvm-strip/strip on PATH -- shipping unstripped"
done
GLIBC_FLOOR=2.28
REQUIRED=$(llvm-nm -D --undefined-only "$DEST" | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//')
MAX=$(printf '%s\n%s\n' "$REQUIRED" "$GLIBC_FLOOR" | sort -V | tail -1)
[ "$MAX" = "$GLIBC_FLOOR" ] || {
    echo "refusing to tag manylinux_${GLIBC_FLOOR%.*}_${GLIBC_FLOOR#*.}: needs GLIBC_$MAX" >&2
    exit 1
}
if llvm-readelf -d "$DEST" | grep -qiE 'rpath|runpath'; then
    echo "refusing to package: the module carries an RPATH/RUNPATH" >&2
    llvm-readelf -d "$DEST" | grep -iE 'rpath|runpath' >&2
    exit 1
fi
echo "manylinux_2_28: max glibc required is $(printf '%s\n' "$REQUIRED" | sort -V | tail -1), no RPATH"
rm -rf dist
GIT_VERSION=$(git describe --abbrev=0 --tag --always | cut -f2 -dv) "$PY" setup.py --quiet \
    bdist_wheel --plat-name "manylinux_2_28_$(uname -m)"
ls -la dist/*.whl
cd ..
UV_PROJECT_ENVIRONMENT=build/venv/wheelcheck uv sync --only-group wheelcheck --quiet
uv pip install --python build/venv/wheelcheck/bin/python --quiet --reinstall --no-deps \
    xdyn_wrapper_python/dist/*.whl
TESTS=$PWD/xdyn_wrapper_python/unit_tests
CHECKPY=$PWD/build/venv/wheelcheck/bin/python
mkdir -p build/scratch/python-tests
cd build/scratch/python-tests
"$CHECKPY" -m pytest -q "$TESTS"
'''

[tasks."python:doc"]
description = "Build the wrapper's Sphinx API documentation -> build/doc/python/html/"
depends = ["python:build"]
run = '''
set -e
UV_PROJECT_ENVIRONMENT=build/venv/doc uv sync --only-group doc --quiet
SO_DIR=$(sh tools/build-dir.sh)/python
PY=$PWD/build/venv/doc/bin/python
DOC=$PWD/xdyn_wrapper_python/doc
OUT=$PWD/build/doc/python
GIT_VERSION=$(git describe --abbrev=0 --tag --always | cut -f2 -dv)
rm -rf "$OUT"
mkdir -p "$OUT"
cd "$OUT"
"$PY" -m sphinx.cmd.quickstart --quiet --project xdyn --author Sirehna \
    -v "$GIT_VERSION" -r "$GIT_VERSION" -l en --sep \
    --ext-autodoc --ext-doctest --ext-intersphinx --ext-todo \
    --extensions=sphinx.ext.autosummary \
    --extensions=sphinx_autopackagesummary \
    --extensions=myst_parser src
printf '\nautosummary_generate = True\nautoclass_content = "class"\n' >> src/source/conf.py
cp "$DOC"/index.rst "$DOC"/api.rst "$DOC"/xdyn.rst src/source/
mkdir -p src/source/_templates/autosummary
cp "$DOC"/autosummary/* src/source/_templates/autosummary/
PYTHONPATH="$SO_DIR" "$PY" -m sphinx -b html src/source html
echo "OK -> $OUT/html/index.html"
'''

[tasks."doc:cpp"]
description = "Build the C++ API reference with Doxygen -> build/doc/doxygen/html/"
run = '''
set -e
mkdir -p build/doc/doxygen
doxygen doxygen/Doxyfile
echo "OK -> $PWD/build/doc/doxygen/html/index.html"
'''

[tasks."python:lint"]
description = "Check the wrapper's Python with ruff"
run = '''
UV_PROJECT_ENVIRONMENT=build/venv/lint uv sync --only-group lint --quiet
build/venv/lint/bin/ruff check
'''

[tasks."python:format"]
description = "Reformat the wrapper's Python with ruff (not enforced -- see python:lint)"
run = '''
UV_PROJECT_ENVIRONMENT=build/venv/lint uv sync --only-group lint --quiet
build/venv/lint/bin/ruff format
'''

[tasks.clean]
description = "Remove build/ — artifacts, venvs, task scratch and generated docs"
run = "rm -rf build"

[tasks.lint]
description = "Check for tabs in source files"
run = """
if grep --recursive --include='*.cpp' --include='*.c' --include='*.hpp' --include='*.h' \
        --exclude-dir=ssc --exclude-dir=websocketpp \
        --exclude-dir=eigen3-hdf5 --exclude-dir=thirdparty -P "\t" xdyn/ ; then
    echo "Tabs found in the lines shown above."
    exit 1
else
    echo "Repo passed no-tabs check."
fi
"""
